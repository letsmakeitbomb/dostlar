<!doctype html>
<meta charset="utf-8">
<title>share file test</title>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<input type="file" id="importFile" hidden>
<pre id="out">running…</pre>
<script type="module">
// Group menu → Share file (fake share sheet), then imports the shared file back.
const t = { id: 'g', name: 'North trip', createdAt: 1, friends: [{ id: 'a', name: 'Ali' }, { id: 's', name: 'سارا' }],
  events: [{ id: 'e', name: 'Cake', payerId: 'a', presence: {}, extra: 0,
    items: [{ id: 'i', name: 'Cake', kind: 'SHARED', price: 100000, quantities: {}, excluded: [] }] }] };
localStorage.setItem('dostlar.trips.v1', JSON.stringify([t]));
history.replaceState(null, '', '#/');
let shared = null;
navigator.canShare = (d) => !!(d && d.files);
navigator.share = async (d) => { shared = d; };
await import('../app.js');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const out = [];
try {
  document.querySelector('[data-act=tripMenu]').click();
  await wait(30);
  out.push('menu: ' + [...document.querySelectorAll('#dlg .menu button')].map((b) => b.dataset.v).join(', '));
  document.querySelector('#dlg [data-v=sharefile]').click();
  for (let i = 0; i < 100 && !shared; i++) await wait(20);
  const f = shared.files[0];
  out.push(`shared: ${f.name} | ${f.type}`);
  // import it back through the Import button's file input
  const input = document.getElementById('importFile');
  const dt = new DataTransfer();
  dt.items.add(new File([await f.text()], f.name, { type: 'text/plain' }));
  input.files = dt.files;
  input.dispatchEvent(new Event('change'));
  for (let i = 0; i < 100 && JSON.parse(localStorage.getItem('dostlar.trips.v1')).length < 2; i++) await wait(20);
  const all = JSON.parse(localStorage.getItem('dostlar.trips.v1'));
  out.push('after import: ' + all.map((x) => `${x.name} (${x.friends.length} friends, ${x.events.length} events)`).join(' | '));
} catch (e) { out.push('ERROR ' + e.message); }
document.getElementById('out').textContent = out.join('\n');
</script>
