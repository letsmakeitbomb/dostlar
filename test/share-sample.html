<!doctype html>
<meta charset="utf-8">
<title>share image sample</title>
<pre id="out">running…</pre>
<script type="module">
// Renders the share image for the Windows app's Bohlul-BD.json and prints it as a data URL.
import * as C from '../calc.js';
import { drawResult } from '../shareimage.js';
try {
  const text = await (await fetch('/windows/saved/Bohlul-BD.json')).text();
  const t = C.importTrip(text, 'Bohlul-BD');
  const canvas = drawResult(t, C.tripResult(t));
  document.getElementById('out').textContent = canvas.toDataURL('image/png');
} catch (e) { document.getElementById('out').textContent = 'ERROR ' + e.message; }
</script>
