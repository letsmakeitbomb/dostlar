<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00796b">
  <meta name="description" content="Split shared costs between friends. Works offline.">
  <title>Dostlar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app"></main>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>
  <input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" hidden>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // When a newer version has been downloaded, reload once so it is used right away.
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
          // Check for a new version each time the app is brought back to the screen.
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        });
      });
    }
  </script>
</body>
</html>
